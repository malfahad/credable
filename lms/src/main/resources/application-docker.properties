# Server Configuration
server.port=8080
spring.application.name=lms

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:lmsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=lmsuser
spring.datasource.password=lmspassword
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Client Registration Configuration
client.registration.url=http://scoring-service:8094/api/v1/scoring/createClient
client.name=LMS Service
client.username=admin
client.password=pwd123

# KYC Service Configuration
kyc.service.url=http://cbs-service:8093/cbs/customerService
kyc.service.username=admin
kyc.service.password=pwd123

logging.level.root=DEBUG

# Scoring API Configuration
scoring.api.base.url=http://scoring-service:8094/api/v1/scoring
scoring.api.timeout=300000 

# LMS URL Configuration
lms.url=http://lms:8080

# Transaction Service Configuration
transaction.service.url=http://cbs-service:8093/cbs/transactionService
transaction.service.username=admin
transaction.service.password=pwd123
